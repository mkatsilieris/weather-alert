# Access log: client IP, request, status, bytes, referer, user agent, time taken, and the
# X-Request-Id the API attached, so a line here can be matched with the API log.
log_format app '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time reqId=$upstream_http_x_request_id';

# Do not log docker's own health check (busybox wget hitting / every 30s).
map $http_user_agent $loggable {
    ~^Wget 0;
    default 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log app if=$loggable;

    # Requests that arrive through the Cloudflare Tunnel come from the cloudflared container
    # (docker network) and carry the visitor's address in CF-Connecting-IP. Use it as the client
    # IP for logs and for X-Real-IP / X-Forwarded-For. Local-network visitors are unaffected.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;

    # Security headers. nginx does not inherit add_header into a location that sets its own
    # (Cache-Control below), so the snippet is included in every block.
    include /etc/nginx/snippets/security-headers.conf;

    # Backend API
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets: cache forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker + manifest + index: always revalidate
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
